AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable

Layout/LineLength:
  Max: 120

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

Metrics/MethodLength:
  Max: 20

Metrics/AbcSize:
  Max: 22

Metrics/ClassLength:
  # Collector orchestrates two passes (lifetime totals + recent window) plus
  # resume handling. If it grows much past this, split the resume concern out.
  Max: 200
